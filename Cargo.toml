# Turns raw bank data into hledger books. The engine does no IO; the other
# crates read and write the repository, diagnose the mapping, and report on
# the books (see docs/spec.md §2).
[workspace]
members = ["crates/*"]
default-members = ["crates/konter"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

# Nothing here needs `unsafe`, and this keeps it that way.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
konter-diagnostics = { path = "crates/diagnostics" }
konter-engine = { path = "crates/engine" }
konter-report = { path = "crates/report" }
konter-repo = { path = "crates/repo" }

anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
insta = "1.49.0"
jiff = { version = "0.2.40", features = ["serde"] }
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto", "use_pem"] }
regex = "1.13.1"
rust_decimal = "1.43.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
toml = "1.2.1"
ureq = { version = "3.5.1", features = ["json"] }
