[books]
start = 2026-01-01

[banks.nordea]
enable_banking = { aspsp = "Nordea", country = "DK" }

# An export, and fetched data without running balances that goes on after it.
[sources."bank:a"]
bank = "nordea"
number = "1234567890"
ledger = "assets:bank:a"
formats = ["nordea-csv", "enable-banking"]

# Enable Banking only, no running balances: opening balance from the snapshot.
[sources."other:c"]
bank = "other"
number = "42"
ledger = "assets:bank:c"
formats = ["enable-banking"]
unmatched = "allow"
